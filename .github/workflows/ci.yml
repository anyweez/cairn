name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@127.0.0.1:5432/postgres?sslmode=disable
      # Fail, rather than skip, the ledger tests if the database is missing.
      CAIRN_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: manifest tool
        run: |
          go -C cmd/cairn-manifest vet ./...
          go -C cmd/cairn-manifest test ./...
      - name: spec manifest is current
        run: |
          go -C cmd/cairn-manifest run . -dir ../..
          if ! git diff --exit-code -- spec.manifest.json; then
            echo "::error::spec.manifest.json is stale: run 'go -C cmd/cairn-manifest run . -dir ../..' and commit it"
            exit 1
          fi
      - name: stored types stay readable
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          if git show FETCH_HEAD:spec.manifest.json > "$RUNNER_TEMP/base.json" 2>/dev/null; then
            go -C cmd/cairn-manifest run . -dir ../.. -o - -base "$RUNNER_TEMP/base.json" > /dev/null
          else
            echo "$GITHUB_BASE_REF has no spec.manifest.json yet"
          fi
