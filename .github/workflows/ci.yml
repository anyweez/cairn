name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    # Release notes are generated from commit messages, so every commit a PR
    # brings in must be in commitizen (conventional commits) format. Merge
    # commits are exempt.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: commit messages
        run: >-
          pipx run --spec commitizen==4.19.2 cz check
          --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: configure the test database
        # max_prepared_transactions is a postmaster setting, so it needs a
        # restart rather than the reload the disk settings take. A service
        # container cannot be given a command, so ALTER SYSTEM then restart is
        # how it is set. Without it the ledger's prepared-transaction test
        # skips. Every test creates and drops a database, and each waits on
        # the runner's slow disk, so the disk settings are turned off too;
        # nothing here tests crash durability.
        run: |
          psql "$CAIRN_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "ALTER SYSTEM SET max_prepared_transactions = 16"
          docker restart "${{ job.services.postgres.id }}"
          for _ in $(seq 1 60); do
            if psql "$CAIRN_TEST_DATABASE_URL" -c "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::postgres did not accept connections after the restart"
          exit 1
      - name: check
        # gofmt, vet, every test, the manifest tool and manifest freshness. The
        # same script is the factory's gate and the local pre-push check.
        run: scripts/check.sh
      - name: the prepared-transaction test runs, not skips
        # The test skips when max_prepared_transactions is 0, which would hide
        # the LEAST fence it proves. Fail unless it ran and passed.
        run: |
          status=0
          go test -race -v -run '^TestAnOlderPreparedTransactionIsNotSkipped$' ./ledger/ \
            > "$RUNNER_TEMP/prepared-transactions.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/prepared-transactions.log"
          if ! grep -q -- '--- PASS: TestAnOlderPreparedTransactionIsNotSkipped' "$RUNNER_TEMP/prepared-transactions.log"; then
            echo "::error::TestAnOlderPreparedTransactionIsNotSkipped did not run and pass"
            status=1
          fi
          exit $status
      - name: stored types stay readable
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          # Before the switch to YAML the manifest was spec.manifest.json; -base reads either.
          for name in spec.manifest.yaml spec.manifest.json; do
            if git show "FETCH_HEAD:$name" > "$RUNNER_TEMP/base-manifest" 2>/dev/null; then
              echo "checking stored types against $GITHUB_BASE_REF:$name"
              go -C cmd/cairn-manifest run . -dir ../.. -o - -base "$RUNNER_TEMP/base-manifest" > /dev/null
              exit 0
            fi
          done
          echo "$GITHUB_BASE_REF has no spec manifest yet"

  pooled:
    # The ledger's tests again, through PgBouncer in transaction mode with
    # pgx describing statements instead of preparing them: how a pooled
    # deployment such as Supabase connects. scripts/test-pgbouncer.sh is the
    # same setup locally. simple_protocol sends parameters untyped, which
    # catches JSON passed as bytes.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        exec_mode: [cache_describe, simple_protocol]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      pgbouncer:
        image: edoburu/pgbouncer:v1.24.1-p1
        env:
          DB_HOST: postgres
          DB_USER: cairn
          DB_PASSWORD: cairn
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: 1000
          DEFAULT_POOL_SIZE: 40
        ports:
          - 6432:5432
    env:
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@127.0.0.1:6432/postgres?sslmode=disable&default_query_exec_mode=${{ matrix.exec_mode }}
      CAIRN_REQUIRE_DATABASE: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: configure the test database
        # As in the test job: a postmaster setting applied with ALTER SYSTEM
        # and a restart, so the prepared-transaction test runs rather than
        # skips, plus the disk settings this runner is slow about.
        run: |
          psql "postgres://cairn:cairn@127.0.0.1:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "ALTER SYSTEM SET max_prepared_transactions = 16"
          docker restart "${{ job.services.postgres.id }}"
          for _ in $(seq 1 60); do
            if psql "postgres://cairn:cairn@127.0.0.1:5432/postgres?sslmode=disable" -c "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::postgres did not accept connections after the restart"
          exit 1
      - name: wait for pgbouncer
        run: |
          for _ in $(seq 1 60); do
            psql "postgres://cairn:cairn@127.0.0.1:6432/postgres?sslmode=disable" -c "SELECT 1" >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::pgbouncer did not accept connections"
          exit 1
      - name: ledger tests through the pooler
        run: go test -race ./ledger/... ./examples/...
